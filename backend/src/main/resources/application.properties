spring.application.name=bnabd-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bnabd}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-at-least-32-characters}

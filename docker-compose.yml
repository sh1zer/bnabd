services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bnabd
      POSTGRES_USER: bnabd
      POSTGRES_PASSWORD: bnabd
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnabd -d bnabd"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to inspect the DB from a tool on the host:
    # ports:
    #   - "5432:5432"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/bnabd
      DB_USER: bnabd
      DB_PASS: bnabd
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-at-least-32-characters}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser talks to the backend on this URL. Leave as localhost:8080
        # for a normal single-PC setup. If you want to reach it from another
        # device on your network, set this to http://<this-pc-ip>:8080 before
        # building (see the README).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
